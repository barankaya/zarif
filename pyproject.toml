[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zarif"
version = "0.1.0"
description = "Agent'lara verilen markdown talimat dosyalarını anlamı koruyarak sadeleştiren CLI aracı."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Zarif contributors" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
local = ["langchain-ollama>=0.2"]
api = ["langchain-openai>=0.2"]
# v1 API (FastMCP, SamplingMessage, ctx.session.create_message). mcp 2.x renamed
# FastMCP -> MCPServer and changed the sampling API, which this code does not use.
mcp = ["mcp>=1.2,<2"]
dev = ["pytest>=8.0"]

[project.scripts]
zarif = "zarif.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zarif = ["benchmark/samples/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
